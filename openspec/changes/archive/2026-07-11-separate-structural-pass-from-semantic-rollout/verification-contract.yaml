contract_version: 1
change: separate-structural-pass-from-semantic-rollout
obligations:
  - id: req.world.status
    source: "specs/semantic-rollout-status/spec.md#Requirement: Separate structural and semantic status"
    claim: "Structural, semantic, provider, and aggregate rollout states remain distinct and fail closed."
    required: true
    evidence: [check.world.semantic]
  - id: req.world.bindings-and-probes
    source: "specs/semantic-rollout-status/spec.md#Requirement: Known negative semantic probes"
    claim: "Typed executors reject the seven known shallow semantic cases."
    required: true
    evidence: [check.world.semantic]
  - id: req.world.receipt
    source: "specs/semantic-rollout-status/spec.md#Requirement: Native WorldGuard depth receipt"
    claim: "WorldGuard emits a native receipt with explicit structural-only and provider boundaries."
    required: true
    evidence: [check.world.semantic, check.world.full]
checks:
  - id: check.world.semantic
    kind: command
    command: python
    args: [-m, pytest, tests/test_semantic_rollout.py, -q]
    required: true
    covers: [req.world.status, req.world.bindings-and-probes, req.world.receipt]
    expected: {exit_code: 0}
  - id: check.world.flowguard
    kind: command
    command: python
    args: [.flowguard/run_semantic_rollout_checks.py]
    required: true
    covers: [req.world.status, req.world.bindings-and-probes]
    expected: {exit_code: 0}
  - id: check.world.full
    kind: command
    command: python
    args: [-m, pytest, -q]
    required: true
    covers: [req.world.receipt]
    expected: {exit_code: 0}
  - id: check.openspec.strict
    kind: command
    command: openspec
    args: [validate, separate-structural-pass-from-semantic-rollout, --strict]
    required: true
    covers: [req.world.status, req.world.bindings-and-probes, req.world.receipt]
    expected: {exit_code: 0}
  - id: check.flowguard.audit
    kind: command
    command: python
    args: [-m, flowguard, project-audit, --root, .]
    required: true
    covers: [req.world.receipt]
    expected: {exit_code: 0}
freshness:
  watch:
    - openspec/changes/separate-structural-pass-from-semantic-rollout/.openspec.yaml
    - openspec/changes/separate-structural-pass-from-semantic-rollout/README.md
    - openspec/changes/separate-structural-pass-from-semantic-rollout/proposal.md
    - openspec/changes/separate-structural-pass-from-semantic-rollout/design.md
    - openspec/changes/separate-structural-pass-from-semantic-rollout/tasks.md
    - openspec/changes/separate-structural-pass-from-semantic-rollout/verification-contract.yaml
    - openspec/changes/separate-structural-pass-from-semantic-rollout/specs/**/*.md
    - worldguard/**/*.py
    - tests/**/*.py
    - skills/worldguard/**/*
    - .flowguard/**/*
