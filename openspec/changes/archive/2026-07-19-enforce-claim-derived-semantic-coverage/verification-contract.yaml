
contract_version: 1
change: enforce-claim-derived-semantic-coverage
evidence_roots:
  SKILLGUARD_EVIDENCE: work/verification/enforce-claim-derived-semantic-coverage
obligations:
  - id: req.world.guard-model-purpose
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Target-owned Guard-model prevention contract"
    claim: "Every registered Guard declares the invalid claim class it prevents, its unsupported boundary, and exactly one native good that passes unit and semantic execution."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.guard-failure-universe
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Finite protected Guard-failure universe"
    claim: "The source-discovered Guard-owned failure inventory is complete and every failure class has exactly one native bad with an exact status/code oracle."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.single-enforced-closure
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: One enforced semantic closure"
    claim: "WorldGuard always executes required semantics and rejects the retired structural-only field and CLI selector."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.router-visible-native-ownership
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Router-visible native ownership"
    claim: "The current contract exposes the complete existing target-native route and check bindings at the top level without creating a parallel executor."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.routes
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Claim-derived Guard routes"
    claim: "Structured claim atoms derive required Guards and omitted routes fail closed."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.universe
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Expected semantic coverage universe"
    claim: "Expected nodes, children, scenarios, horizon, branches, perturbations, and skips are quantitative and mesh-bound."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.predictive
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Predictive adequacy"
    claim: "Single-event and single-equation probes cannot license prediction, while a complete supported fixture can."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.temporal-floor
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Bounded target-owned temporal policy"
    claim: "A target-owned count/ratio floor and native early/middle/late phases block sparse or one-phase long-horizon sampling without requiring every point."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.per-object
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Per-model-node predictive depth"
    claim: "Each expected predictive model node meets its own rollout depth; aggregate union evidence cannot hide a shallow child."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.receipt
    source: "specs/semantic-rollout-status/spec.md#Requirement: Native WorldGuard depth receipt"
    claim: "The current native receipt separates bounded semantic pass from predictive readiness and lists every skip."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.skill
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Target-run native receipt"
    claim: "WorldGuard skills and target-local SkillGuard bindings require a per-target mesh receipt; static checks are engine health only."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.skillguard-v2
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Target-run native receipt"
    claim: "The current generic contract preserves native routes, compiles deterministically, and supervises exact target-owned Guard-model and predictive-depth checks without duplicating their meaning."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.reconciliation-variable-floor
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Per-variable or signal temporal depth"
    claim: "All discovered semantic/predictive nodes reconcile with declared/excluded scope, exclusions do not contribute, and every exposed variable/signal uses the native dynamic temporal floor without a fixed SkillGuard ratio conflict."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.v2-only-retirement
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Single current generic SkillGuard authority"
    claim: "WorldGuard has one current generic native-integrated authority, one enforced profile, no optional/domain modes, and an expanded-scope retirement receipt."
    required: true
    evidence: [check.worldguard.parent-receipt]
  - id: req.world.receipt-only-verification
    source: "specs/claim-derived-semantic-coverage/spec.md#Requirement: Receipt-only OpenSpec verification"
    claim: "OpenSpec consumes the current parent receipt without executing any owner."
    required: true
    evidence: [check.worldguard.parent-receipt]
checks:
  - id: check.worldguard.parent-receipt
    kind: immutable_evidence_reference
    semantic_check_id: semantic.worldguard.v2-parent
    artifact_ref:
      ref_path: work/verification/enforce-claim-derived-semantic-coverage/portable/enforce-claim-derived-semantic-coverage/ref.json
      expected_schema: skillguard.test_mesh_aggregation.current
      expected_status: passed
    consumer: worldguard.release-gate
    execution_policy:
      owner_execution_allowed: false
      resume_allowed: false
      verification_mode: read_only_replay
    validation_scope: full
    snapshot_policy: frozen
    required: true
    covers:
      - req.world.guard-model-purpose
      - req.world.guard-failure-universe
      - req.world.single-enforced-closure
      - req.world.router-visible-native-ownership
      - req.world.routes
      - req.world.universe
      - req.world.predictive
      - req.world.temporal-floor
      - req.world.per-object
      - req.world.receipt
      - req.world.skill
      - req.world.skillguard-v2
      - req.world.reconciliation-variable-floor
      - req.world.v2-only-retirement
      - req.world.receipt-only-verification
    expected: {exit_code: 0}
freshness:
  watch:
    - openspec/changes/enforce-claim-derived-semantic-coverage/v1-retirement-inventory.json
    - scripts/verify_guard_simulation_readiness.py
    - tests/test_skillguard_v2_runtime_authority_audit.py
    - tests/test_openspec_receipt_only_verification.py
    - openspec/changes/enforce-claim-derived-semantic-coverage/.openspec.yaml
    - openspec/changes/enforce-claim-derived-semantic-coverage/proposal.md
    - openspec/changes/enforce-claim-derived-semantic-coverage/design.md
    - openspec/changes/enforce-claim-derived-semantic-coverage/tasks.md
    - openspec/changes/enforce-claim-derived-semantic-coverage/verification-contract.yaml
    - openspec/changes/enforce-claim-derived-semantic-coverage/specs/**/*.md
    - worldguard/**/*.py
    - .flowguard/guard_model_contract_exhaustion.py
    - tests/test_guard_model_contract.py
    - tests/test_claim_derived_coverage.py
    - tests/test_semantic_rollout.py
    - tests/test_skillguard_v2_depth_bridge.py
    - scripts/verify_skillguard_v2_supervision.py
    - skills/worldguard/**/*
    - .flowguard/claim_derived_coverage_process.py
    - .flowguard/run_claim_derived_coverage_checks.py
