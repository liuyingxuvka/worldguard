contract_version: 1
change: add-worldguard-template-pack-builder
evidence_roots:
  OWNER_EVIDENCE: work/verification/add-worldguard-template-pack-builder/owners
  PARENT_RECEIPT: work/verification/add-worldguard-template-pack-builder/parent/ref.json

execution_plan:
  plan_id: worldguard-template-pack-builder-final
  frozen_after_source_stable: true
  final_full_owner_id: owner.worldguard.template-pack-full-suite
  current_validation_scope: focused_and_affected_projection_extension
  final_full_owner_disposition: historical_stale_after_projection_extension_and_not_reexecuted_by_explicit_instruction
  source_inputs:
    - openspec/changes/add-worldguard-template-pack-builder/.openspec.yaml
    - openspec/changes/add-worldguard-template-pack-builder/proposal.md
    - openspec/changes/add-worldguard-template-pack-builder/design.md
    - openspec/changes/add-worldguard-template-pack-builder/specs/**/*.md
    - openspec/changes/add-worldguard-template-pack-builder/verification-contract.yaml
    - worldguard/template_packs.py
    - worldguard/__init__.py
    - skills/worldguard/.skillguard/runtime/worldguard/template_packs.py
    - skills/worldguard/.skillguard/runtime/worldguard/__init__.py
    - tests/test_template_packs.py
    - .flowguard/existing_model_preflight/template_pack_builder_preflight.py
    - .flowguard/worldguard_template_pack_builder.py
    - .flowguard/worldguard_template_pack_field_lifecycle.md
    - .flowguard/worldguard_template_pack_development_process.md
    - skills/worldguard/SKILL.md
    - skills/worldguard/references/template-packs.md
    - skills/worldguard/.skillguard/contract-source.json
    - skills/worldguard/.skillguard/compiled-contract.json
    - skills/worldguard/.skillguard/check-manifest.json
    - skills/worldguard/.skillguard/contract_model.py
    - skills/worldguard/.skillguard/checks/check_template_packs.py
  evidence_outputs:
    - openspec/changes/add-worldguard-template-pack-builder/tasks.md
    - openspec/changes/add-worldguard-template-pack-builder/verification-report.json
    - work/verification/add-worldguard-template-pack-builder/**/*
    - skills/worldguard/.skillguard/runs/**/*
  invalidation_rule: A source input change invalidates only owners whose declared input set consumes it. Evidence outputs, receipts, reports, logs, progress, and task checkmarks never invalidate or relaunch their producer.
  timeout_rule: A timed-out or interrupted owner is non-reusable until its entire descendant process tree is confirmed absent.

owners:
  - id: owner.worldguard.template-pack-preflight
    command: python .flowguard/existing_model_preflight/template_pack_builder_preflight.py
    depends_on: []
    inputs:
      - .flowguard/existing_model_preflight/template_pack_builder_preflight.py
      - worldguard/contracts.py
      - worldguard/guard_model_contract.py
      - worldguard/mesh.py
    covers: [req.worldguard.existing-owner-reuse]
  - id: owner.worldguard.template-pack-flow-model
    command: python .flowguard/worldguard_template_pack_builder.py
    depends_on: [owner.worldguard.template-pack-preflight]
    inputs:
      - .flowguard/worldguard_template_pack_builder.py
    covers:
      - req.worldguard.selection
      - req.worldguard.field-ownership
      - req.worldguard.native-authority
      - req.worldguard.target-neutral-projection
      - req.worldguard.projection-native-inventory
      - req.worldguard.projection-native-freshness
  - id: owner.worldguard.template-pack-focused-tests
    command: python -m pytest tests/test_template_packs.py -q
    depends_on: [owner.worldguard.template-pack-flow-model]
    inputs:
      - worldguard/template_packs.py
      - worldguard/__init__.py
      - tests/test_template_packs.py
    covers:
      - req.worldguard.manifest
      - req.worldguard.selection
      - req.worldguard.field-ownership
      - req.worldguard.slots
      - req.worldguard.fingerprint
      - req.worldguard.native-authority
      - req.worldguard.builtins
      - req.worldguard.target-neutral-projection
      - req.worldguard.projection-native-inventory
      - req.worldguard.projection-native-freshness
  - id: owner.worldguard.template-pack-affected-tests
    command: python -m pytest tests/test_claim_derived_coverage.py -q
    depends_on: [owner.worldguard.template-pack-focused-tests]
    inputs:
      - worldguard/template_packs.py
      - worldguard/contracts.py
      - tests/test_claim_derived_coverage.py
    covers:
      - req.worldguard.native-authority
      - req.worldguard.template-validation-boundary
  - id: owner.worldguard.guard-model-contract
    command: python -m worldguard.guard_model_contract
    depends_on: [owner.worldguard.template-pack-focused-tests]
    inputs:
      - worldguard/guard_model_contract.py
      - worldguard/contracts.py
      - worldguard/semantic.py
      - worldguard/guards/**/*.py
    covers: [req.worldguard.native-authority]
  - id: owner.worldguard.skillguard-contract
    cwd: skills/worldguard
    command: python -m skillguard_compile . --check
    depends_on:
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.template-pack-native-check
    inputs:
      - skills/worldguard/SKILL.md
      - skills/worldguard/references/template-packs.md
      - skills/worldguard/.skillguard/contract-source.json
      - skills/worldguard/.skillguard/compiled-contract.json
      - skills/worldguard/.skillguard/check-manifest.json
      - skills/worldguard/.skillguard/contract_model.py
      - skills/worldguard/.skillguard/checks/check_template_packs.py
      - skills/worldguard/.skillguard/runtime/worldguard/template_packs.py
    covers:
      - req.worldguard.native-authority
      - req.worldguard.template-validation-boundary
      - req.worldguard.target-neutral-projection
      - req.worldguard.projection-native-inventory
      - req.worldguard.projection-native-freshness
  - id: owner.worldguard.template-pack-native-check
    cwd: skills/worldguard
    command: python .skillguard/checks/check_template_packs.py
    depends_on: [owner.worldguard.template-pack-focused-tests]
    inputs:
      - skills/worldguard/.skillguard/checks/check_template_packs.py
      - skills/worldguard/.skillguard/runtime/worldguard/template_packs.py
      - skills/worldguard/.skillguard/runtime/worldguard/contracts.py
      - skills/worldguard/.skillguard/runtime/worldguard/guard_model_contract.py
      - skills/worldguard/.skillguard/runtime/worldguard/mesh.py
    covers:
      - req.worldguard.target-neutral-projection
      - req.worldguard.projection-native-inventory
      - req.worldguard.projection-native-freshness
  - id: owner.worldguard.template-pack-full-suite
    command: python -m pytest -q
    depends_on:
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.guard-model-contract
      - owner.worldguard.skillguard-contract
    inputs:
      - worldguard/**/*.py
      - tests/**/*.py
      - skills/worldguard/.skillguard/runtime/worldguard/**/*.py
    covers:
      - req.worldguard.manifest
      - req.worldguard.selection
      - req.worldguard.field-ownership
      - req.worldguard.slots
      - req.worldguard.fingerprint
      - req.worldguard.native-authority
      - req.worldguard.builtins
      - req.worldguard.template-validation-boundary
    required_for_current_scope: false
    execution_status: historical_stale_not_reexecuted

obligations:
  - id: req.worldguard.existing-owner-reuse
    source: "design.md#Context"
    claim: "The builder extends WorldGuard's existing contract, purpose-proof, and mesh owners without creating a parallel semantic route."
    required: true
    evidence: [owner.worldguard.template-pack-preflight]
  - id: req.worldguard.manifest
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: WorldGuard owns validating template-pack manifests"
    claim: "Current manifests declare exact WorldGuard-owned fields, validators, and content identity; stale manifests block."
    required: true
    evidence: [owner.worldguard.template-pack-focused-tests, owner.worldguard.template-pack-full-suite]
  - id: req.worldguard.selection
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Candidate selection has deterministic zero, one, and many outcomes"
    claim: "Zero selects the unique base, one selects the candidate, and many blocks with all candidates visible."
    required: true
    evidence: [owner.worldguard.template-pack-flow-model, owner.worldguard.template-pack-focused-tests]
  - id: req.worldguard.field-ownership
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Composition enforces exact field ownership"
    claim: "Only exact disjoint fragment ownership composes; overlap, undeclared writes, and kind mismatch block."
    required: true
    evidence: [owner.worldguard.template-pack-flow-model, owner.worldguard.template-pack-focused-tests]
  - id: req.worldguard.slots
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Task-specific content uses explicit slots"
    claim: "Every slot resolves exactly and missing or unused bindings block."
    required: true
    evidence: [owner.worldguard.template-pack-focused-tests]
  - id: req.worldguard.fingerprint
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Built instances bind exact fingerprints"
    claim: "Manifest, registry, selection, bindings, output, validators, and instance identities are content-bound."
    required: true
    evidence: [owner.worldguard.template-pack-focused-tests]
  - id: req.worldguard.native-authority
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Native validators retain semantic authority"
    claim: "Existing WorldGuard-native parsing and task-purpose proof remain authoritative; templates and SkillGuard do not decide Guard semantics."
    required: true
    evidence:
      - owner.worldguard.template-pack-flow-model
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.guard-model-contract
      - owner.worldguard.skillguard-contract
  - id: req.worldguard.builtins
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Built-in packs cover GuardContract and ModelMeshContract scaffolding"
    claim: "WorldGuard provides validated GuardContract and ModelMesh base/candidate scaffolds without authoring task evidence."
    required: true
    evidence: [owner.worldguard.template-pack-focused-tests]
  - id: req.worldguard.template-validation-boundary
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Template validation integrates without replacing final closure"
    claim: "Template validation remains construction-only and cannot replace WorldGuard execution, native depth, or SkillGuard closure."
    required: true
    evidence: [owner.worldguard.skillguard-contract, owner.worldguard.template-pack-affected-tests]
  - id: req.worldguard.target-neutral-projection
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: WorldGuard exports an exact target-owned neutral projection"
    claim: "WorldGuard emits only the exact unsealed central root/catalog/template fields and rejects unknown root fields without transferring applicability semantics."
    required: true
    evidence:
      - owner.worldguard.template-pack-flow-model
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.template-pack-native-check
      - owner.worldguard.skillguard-contract
  - id: req.worldguard.projection-native-inventory
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Neutral catalog maps every native family manifest exactly once"
    claim: "Catalog templates and applicability rows equal the current native contract-kind registry inventory exactly once and use the native selector outcome."
    required: true
    evidence:
      - owner.worldguard.template-pack-flow-model
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.template-pack-native-check
  - id: req.worldguard.projection-native-freshness
    source: "specs/worldguard-template-pack-builder/spec.md#Requirement: Projection freshness stays bound to native identities"
    claim: "Wrong routes and stale registry identities block, while native manifest, builder, and validator fingerprints enter central content hashes."
    required: true
    evidence:
      - owner.worldguard.template-pack-flow-model
      - owner.worldguard.template-pack-focused-tests
      - owner.worldguard.template-pack-native-check
      - owner.worldguard.skillguard-contract

checks:
  - id: check.worldguard.template-pack-parent-receipt
    kind: immutable_evidence_reference
    semantic_check_id: semantic.worldguard.template-pack-builder-parent
    artifact_ref:
      ref_path: work/verification/add-worldguard-template-pack-builder/parent/ref.json
      expected_schema: skillguard.test_mesh_aggregation.current
      expected_status: passed
    consumer: worldguard.release-gate
    execution_policy:
      owner_execution_allowed: false
      resume_allowed: false
      verification_mode: read_only_replay
    validation_scope: focused_and_affected
    snapshot_policy: frozen
    required: true
    covers:
      - req.worldguard.existing-owner-reuse
      - req.worldguard.manifest
      - req.worldguard.selection
      - req.worldguard.field-ownership
      - req.worldguard.slots
      - req.worldguard.fingerprint
      - req.worldguard.native-authority
      - req.worldguard.builtins
      - req.worldguard.template-validation-boundary
      - req.worldguard.target-neutral-projection
      - req.worldguard.projection-native-inventory
      - req.worldguard.projection-native-freshness
    expected: {exit_code: 0}

freshness:
  watch_source_inputs_only: true
  exclude_outputs:
    - openspec/changes/add-worldguard-template-pack-builder/tasks.md
    - openspec/changes/add-worldguard-template-pack-builder/verification-report.json
    - work/verification/add-worldguard-template-pack-builder/**/*
    - skills/worldguard/.skillguard/runs/**/*
