contract_version: 1
change: harden-guard-simulation-readiness
evidence_roots:
  SKILLGUARD_EVIDENCE: work/verification/harden-guard-simulation-readiness
obligations:
  - id: req.worldguard.module-cli
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Module CLI Must Match Installed CLI"
    claim: "python -m worldguard delegates to the installed CLI implementation and the example check still runs."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.consumer-independence
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Author Control Must Not Enter The Consumer"
    claim: "WorldGuard keeps SkillGuard authority in the author source and verifies one exact target-owned installed consumer with zero .skillguard paths."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.release-sync
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Release Metadata Must Be Synchronized"
    claim: "WorldGuard version metadata, editable import path, OpenSpec change shape, and FlowGuard adoption record are synchronized."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.frozen-parent-receipt
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Archive Gate Replays The Frozen Parent Aggregation"
    claim: "The WorldGuard release gate read-only replays one exact frozen parent aggregation; OpenSpec validates only its own artifacts and never imports, executes, or resumes a validation owner."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.affected-only-validation
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Validation Is Affected-Only Until One Frozen Final Gate"
    claim: "Current-input and template-selection shards invalidate independently, progress outputs are not freshness inputs, and exactly one frozen foreground full owner closes the release gate."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.post-archive-publication
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Publication Is A Single Post-Archive Sequence"
    claim: "SkillGuard read-only replay, official OpenSpec strict validation, and archive precede one publication sequence, after which only read-only identity checks run."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.guard-candidate-purpose-binding
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Formal Guard Candidates Bind A Fresh Task Purpose"
    claim: "Every formal Guard child carries a fresh task/model-instance purpose with one-or-many selected failures and complete target-native good/bad proof; both real proof paths reject missing, empty, stale, wrong-instance, unknown-oracle, incomplete, or post-construction bindings."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.family-baseline-boundary
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Family Inventory Is Baseline, Not Task Authority"
    claim: "The family purpose/failure inventory remains an exhaustive native oracle catalog and regression baseline, but never auto-generates the purpose of a real task child."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.current-input-authority
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Guard Inputs Have One Current Authority"
    claim: "Every Guard reads one current inputs.* authority and visibly rejects retired paths without an alternate reader."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
  - id: req.worldguard.template-no-match
    source: "specs/guard-simulation-readiness/spec.md#Requirement: Template No-Match Is A Blocker"
    claim: "Zero template candidates produce no_match and TEMPLATE_SELECTION_NO_MATCH; the base fragment is not a fallback success route."
    required: true
    evidence: [check.worldguard.readiness-parent-receipt]
checks:
  - id: check.worldguard.readiness-parent-receipt
    kind: immutable_evidence_reference
    semantic_check_id: semantic.worldguard.guard-simulation-readiness-parent
    artifact_ref:
      ref_path: work/verification/harden-guard-simulation-readiness/skillguard-parent-receipt-ref.json
      expected_schema: skillguard.test_mesh_aggregation.current
      expected_status: passed
    consumer: worldguard.release-gate
    execution_policy:
      owner_execution_allowed: false
      resume_allowed: false
      verification_mode: read_only_replay
    validation_scope: full
    snapshot_policy: frozen
    required: true
    covers:
      - req.worldguard.module-cli
      - req.worldguard.consumer-independence
      - req.worldguard.release-sync
      - req.worldguard.frozen-parent-receipt
      - req.worldguard.affected-only-validation
      - req.worldguard.post-archive-publication
      - req.worldguard.guard-candidate-purpose-binding
      - req.worldguard.family-baseline-boundary
      - req.worldguard.current-input-authority
      - req.worldguard.template-no-match
freshness:
  watch:
    - openspec/changes/harden-guard-simulation-readiness/proposal.md
    - openspec/changes/harden-guard-simulation-readiness/design.md
    - openspec/changes/harden-guard-simulation-readiness/specs/**/*.md
    - openspec/changes/harden-guard-simulation-readiness/verification-contract.yaml
    - pyproject.toml
    - worldguard/**/*.py
    - scripts/verify_guard_simulation_readiness.py
    - tests/**/*.py
    - examples/**/*.yaml
    - skills/worldguard/**/*.md
    - skills/worldguard/.skillguard/**/*.json
    - skills/worldguard/.skillguard/**/*.py
    - .flowguard/**/*.toml
    - .flowguard/**/*.py
